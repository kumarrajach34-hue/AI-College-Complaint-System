<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI College Complaint Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="main-header">
            <h1>AI College Complaint Management</h1>
            <p>Report • Track • Resolve</p>
        </header>

        <section class="attendance-box">
            <h2>Submit a Complaint</h2>

            <form id="complaintForm">
                <input
                    type="text"
                    id="studentName"
                    placeholder="Student Name"
                    required
                >

                <input
                    type="text"
                    id="rollNumber"
                    placeholder="College Roll Number (e.g. 23CS001)"
                    required
                >

                <input
                    type="text"
                    id="department"
                    placeholder="Department (e.g. CSE, ECE)"
                    required
                >

                <select id="category" required>
                    <option value="">Select Category</option>
                    <option value="Classroom">Classroom</option>
                    <option value="Faculty">Faculty</option>
                    <option value="Infrastructure">Infrastructure</option>
                    <option value="Hostel">Hostel</option>
                    <option value="Transport">Transport</option>
                    <option value="Library">Library</option>
                    <option value="Examination">Examination</option>
                    <option value="Other">Other</option>
                </select>

                <textarea
                    id="complaint"
                    rows="4"
                    placeholder="Describe your complaint..."
                    required
                ></textarea>

                <button id="submitBtn" type="submit">
                    Submit Complaint
                </button>

                <p id="formMessage" role="status" aria-live="polite"></p>
            </form>
        </section>

        <section class="tracking-box">
            <h2>Track Your Complaint</h2>

            <input
                type="text"
                id="trackRollNumber"
                placeholder="Enter your college roll number"
            >

            <button id="trackBtn" type="button">
                Track Complaint
            </button>

            <p id="trackMessage" role="status" aria-live="polite"></p>
            <div id="complaintList"></div>
        </section>
    </div>

    <!-- Load Socket.IO from the deployed Render backend -->
    <script src="https://ai-college-complaint-system.onrender.com/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
